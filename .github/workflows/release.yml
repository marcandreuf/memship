# Release — promote a validated RC image to a version tag
#
# Triggered by pushing an annotated git tag `vX.Y.Z` (git tags are the single source
# of truth for the version — there is no VERSION file). This PROMOTES the RC image
# already built for the tagged commit (build-images.yml) to `:X.Y.Z` + `:latest`
# WITHOUT rebuilding — the exact bytes staging validated.
#
# A missing RC image FAILS the release rather than rebuilding from the tag. Rebuilding
# looks like it worked and quietly breaks the guarantee: what ships is then a fresh
# build nobody validated, differing from staging by whatever moved in the base image
# or the dependency tree since. That is what happened to the frontend in v2.0.0.
# build-images.yml now builds every service on every main commit, so an absent RC
# means something genuinely went wrong and is worth stopping for.
#
# `allow_rebuild` is the escape hatch, for re-promoting a tag old enough that its RC
# images have been cleaned up.
#
# Release a validated commit with: ./scripts/release.sh <version>
#
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to (re)promote, e.g. v1.3.0'
        required: true
      allow_rebuild:
        description: 'Build from the tag if no RC image exists (breaks build-once-promote)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # contents: write is for creating the release draft, nothing else — the
      # workflow pushes no commits and moves no tags.
      contents: write
      packages: write
    steps:
      - name: Resolve tag and version
        id: ver
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ver.outputs.tag }}
          # Full history and every tag: the release draft needs the previous tag
          # to list what changed, and the tag set to decide whether this version
          # is the newest line or a patch to an older one.
          fetch-depth: 0

      - name: Resolve commit SHA
        id: sha
        run: echo "short_sha=$(git rev-parse HEAD | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # The one genuinely useful check the old pre-commit hook did, moved server-side
      # so it is enforced for everyone: the released version must be in the roadmap.
      - name: Roadmap guard
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if grep -qF "| v$VERSION " README.md; then
            echo "v$VERSION found in the README roadmap."
          else
            echo "::error::v$VERSION is not in the README.md roadmap table. Add its row before releasing."
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Checked for every service before anything is promoted, so a half-released
      # version — backend at the new tag, frontend still at the old one — is not
      # reachable. Operators upgrade by moving one IMAGE_TAG.
      - name: Check the RC set is complete
        id: rc
        env:
          OWNER: ${{ github.repository_owner }}
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          missing=()
          for svc in backend frontend; do
            RC="$REGISTRY/$OWNER/memship-$svc:sha-$SHORT_SHA"
            if docker buildx imagetools inspect "$RC" >/dev/null 2>&1; then
              echo "found $RC"
            else
              echo "MISSING $RC"
              missing+=("$svc")
            fi
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "complete=false" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event.inputs.allow_rebuild }}" == "true" ]]; then
            echo "::warning::No RC image for: ${missing[*]}. Rebuilding from the tag because allow_rebuild was set — the released bytes will not be the ones staging validated."
            exit 0
          fi

          echo "::error::No RC image for: ${missing[*]} at commit $SHORT_SHA."
          {
            echo "### Release aborted — incomplete RC set"
            echo ""
            echo "No release-candidate image for: **${missing[*]}** at \`$SHORT_SHA\`."
            echo ""
            echo "A release promotes the images staging validated; it does not build new"
            echo "ones. Build the missing RC first (Actions → **Build Images** → Run"
            echo "workflow, on this commit), then re-run this release."
            echo ""
            echo "To release anyway, re-run with \`allow_rebuild\` — the published images"
            echo "will then be a fresh build that nothing has validated."
          } >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Promote RC images (build once, promote)
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          for svc in backend frontend; do
            IMAGE="$REGISTRY/$OWNER/memship-$svc"
            RC="$IMAGE:sha-$SHORT_SHA"
            if docker buildx imagetools inspect "$RC" >/dev/null 2>&1; then
              echo "Promoting $RC -> $IMAGE:$VERSION + :latest (no rebuild)"
              docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "$RC"
            else
              echo "::warning::Rebuilding $svc from the tag (allow_rebuild)."
              if [[ "$svc" == "backend" ]]; then
                docker build -f "$svc/docker/Dockerfile" --build-arg APP_VERSION="$VERSION" \
                  -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "$svc"
              else
                docker build -f "$svc/docker/Dockerfile" \
                  -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "$svc"
              fi
              docker push "$IMAGE:$VERSION"
              docker push "$IMAGE:latest"
            fi
          done

      # Promotion used to be the last step, so publishing notes was a separate
      # manual one that got forgotten — only 3 of the first 18 tags have any.
      #
      # This drafts the release rather than publishing it, and seeds it from the
      # version's Released row in README.md, which the roadmap guard above has
      # already proved exists and which a human wrote and reviewed. Deliberately
      # NOT --generate-notes: the value in the existing notes is prose a
      # generator cannot produce — why an exposure mattered, what a default used
      # to hand out — and a commit changelog in its place would quietly lower the
      # bar while looking like the step was done.
      #
      # So: the workflow removes the excuse for forgetting. A person still writes
      # the release.
      - name: Draft the GitHub release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          # Re-promotion via workflow_dispatch must never touch notes that already
          # exist — overwriting a published release with a seeded draft would lose
          # the prose this whole step exists to protect.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already has a release. Left untouched."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ROW="$(grep -F "| v$VERSION " README.md | head -1)"
          SUMMARY="$(printf '%s' "$ROW" | sed -E "s/^\| v${VERSION} \| //; s/ \| [^|]*\|[[:space:]]*$//")"
          if [[ -z "$SUMMARY" || "$SUMMARY" == "$ROW" ]]; then
            echo "::error::Could not parse the v$VERSION row out of README.md. The roadmap guard found the row, so the table's shape has changed — fix the parsing here rather than releasing without notes."
            exit 1
          fi

          # "Feature name — the rest of the sentence" → the part before the first
          # em dash, matching the vX.Y.Z — Feature name title convention.
          HEADLINE="${SUMMARY%% — *}"

          PREV="$(git tag -l 'v*.*.*' --sort=v:refname | grep -B1 -x -F "$TAG" | head -1 || true)"
          if [[ -n "$PREV" && "$PREV" != "$TAG" ]]; then
            RANGE="$PREV..$TAG"
          else
            RANGE="$TAG"
          fi

          # Newest line, or a patch to an older one? Only the former claims Latest.
          HIGHEST="$(git tag -l 'v*.*.*' --sort=v:refname | tail -1)"

          {
            echo "<!-- Draft seeded from the README roadmap row. Replace this summary with the"
            echo "     real notes before publishing: lead on why the change matters, not what"
            echo "     changed. Body starts at ##, no H1. Delete the commit list below. -->"
            echo ""
            echo "## Summary"
            echo ""
            echo "$SUMMARY"
            echo ""
            echo "---"
            echo ""
            echo "### Commits in $RANGE — raw material, delete before publishing"
            echo ""
            git log --no-merges --format='- %s' "$RANGE"
          } > release-notes.md

          LATEST_FLAG="--latest=false"
          if [[ "$HIGHEST" == "$TAG" ]]; then LATEST_FLAG="--latest"; fi

          gh release create "$TAG" \
            --draft \
            $LATEST_FLAG \
            --title "$TAG — $HEADLINE" \
            --notes-file release-notes.md

          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Drafted $TAG — $HEADLINE. Finish the notes and publish it."

      - name: Summary
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          COMPLETE: ${{ steps.rc.outputs.complete }}
          DRAFTED: ${{ steps.draft.outputs.created }}
        run: |
          {
            echo "### Released v$VERSION"
            echo ""
            echo "- \`ghcr.io/${{ github.repository_owner }}/memship-backend:$VERSION\` + \`:latest\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/memship-frontend:$VERSION\` + \`:latest\`"
            echo ""
            if [[ "$COMPLETE" == "true" ]]; then
              echo "Promoted from the release candidates staging validated — no rebuild."
            else
              echo "⚠ Rebuilt from the tag (\`allow_rebuild\`). These are not the bytes staging validated."
            fi
            echo ""
            if [[ "$DRAFTED" == "true" ]]; then
              echo "📝 **The release notes are a draft** — finish and publish them at"
              echo "<https://github.com/${{ github.repository }}/releases>. The images are already live."
            else
              echo "The release already existed; its notes were left alone."
            fi
          } >> $GITHUB_STEP_SUMMARY
