# Build and Push Docker Images to GitHub Container Registry
# Triggers after CI passes on main, or manually
#
name: Build Images

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if version exists'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect changed images
        id: filter
        run: |
          # Manual dispatch rebuilds everything.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only HEAD~1 HEAD)"
          echo "Changed files:"
          echo "$CHANGED"

          backend=false
          frontend=false
          # A VERSION bump (release) rebuilds both images.
          if echo "$CHANGED" | grep -qE '^(backend/|VERSION$)'; then backend=true; fi
          if echo "$CHANGED" | grep -qE '^(frontend/|VERSION$)'; then frontend=true; fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Build backend: $backend | Build frontend: $frontend"

  version:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine version
        id: version
        run: |
          if [[ -f "VERSION" ]]; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
          else
            echo "ERROR: VERSION file not found"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build-backend:
    needs: [changes, version]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/memship-backend
        run: |
          cd backend
          docker build -f docker/Dockerfile \
            --build-arg APP_VERSION=$VERSION \
            -t $IMAGE:$VERSION \
            -t $IMAGE:latest \
            .
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest

  build-frontend:
    needs: [changes, version]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/memship-frontend
        run: |
          cd frontend
          docker build -f docker/Dockerfile \
            -t $IMAGE:$VERSION \
            -t $IMAGE:latest \
            .
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest

  finalize:
    needs: [version, build-backend, build-frontend]
    if: ${{ always() && (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Build Summary
        run: |
          echo "### Docker Images Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.build-backend.result }}" == "success" ]]; then
            echo "| Backend | \`ghcr.io/${{ github.repository_owner }}/memship-backend:${{ needs.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "${{ needs.build-frontend.result }}" == "success" ]]; then
            echo "| Frontend | \`ghcr.io/${{ github.repository_owner }}/memship-frontend:${{ needs.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          fi

  ci-failed:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: CI Failed
        run: |
          echo "### Build Skipped - CI Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Fix the tests before images can be built." >> $GITHUB_STEP_SUMMARY
          exit 1
