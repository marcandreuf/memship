# Build Release-Candidate Images
#
# After CI passes on main, build and push release-candidate (RC) images to GHCR,
# tagged by commit SHA (`sha-<short>`) and with the moving `main` tag. These RC
# images are what the staging environment deploys and validates. A release then
# PROMOTES the exact RC image for the validated commit to `:X.Y.Z` + `:latest`
# (see release.yml) — build once, promote, so staging and prod ship identical bytes.
#
# EVERY service is built on EVERY main commit, deliberately. This used to filter
# by changed path, which left a commit touching only `backend/**` with no frontend
# RC — and release.yml then fell back to rebuilding the frontend from the tag, so
# what shipped was not what staging validated. Confirmed on v2.0.0: the backend
# was promoted, the frontend was rebuilt.
#
# Retagging the unchanged service's `:main` image under the new sha would be
# cheaper, but it is only correct if that service really is unchanged since the
# image `:main` points at. The filter compared `HEAD~1..HEAD`, which sees one
# commit — so a push of several commits could retag stale bytes under a fresh sha
# and ship the wrong frontend silently. Building both is correct by construction,
# the jobs run in parallel so it costs a couple of minutes of wall clock, and
# Actions minutes are free on a public repository.
#
name: Build Images

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - name: Resolve commit SHA
        id: sha
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:12}" >> "$GITHUB_OUTPUT"

  build-backend:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend RC
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/memship-backend
          SHA: ${{ needs.resolve.outputs.sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
        run: |
          cd backend
          docker build -f docker/Dockerfile \
            --build-arg APP_VERSION=sha-$SHORT_SHA \
            --label org.opencontainers.image.revision=$SHA \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t $IMAGE:sha-$SHORT_SHA \
            -t $IMAGE:main \
            .

      # Between build and push on purpose: a build succeeds whether or not the
      # image it produced can start, because it never runs the application. The
      # gap is not theoretical — an image was published whose dependency set had
      # been resolved from PyPI rather than `uv.lock`, and it crash-looped in
      # `alembic upgrade head` before serving anything, with a green build (#305).
      # Running the migrations against a real Postgres is the point: that is
      # where that failure landed, ahead of the first request.
      - name: Smoke-test the backend image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/memship-backend
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker network create smoke >/dev/null
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=memship \
            -e POSTGRES_PASSWORD=memship \
            -e POSTGRES_DB=memship_db \
            postgres:15-alpine >/dev/null
          for _ in $(seq 1 30); do
            if docker exec smoke-db pg_isready -U memship -q 2>/dev/null; then break; fi
            sleep 1
          done

          # A throwaway secret for a container that is deleted seconds later and
          # never reachable from outside the runner. It only has to satisfy the
          # length check the app makes at startup.
          docker run -d --name smoke-api --network smoke -p 127.0.0.1:8099:8000 \
            -e DATABASE_URL=postgresql://memship:memship@smoke-db:5432/memship_db \
            -e SECRET_KEY=smoke-test-secret-key-minimum-32-characters \
            -e APP_ENV=development \
            -e RUN_MIGRATIONS=1 \
            "$IMAGE:sha-$SHORT_SHA" >/dev/null

          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8099/api/v1/health)" = "200" ]; then
              echo "backend image answered /api/v1/health in ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "::error::the backend image never answered /api/v1/health - not pushing"
          docker logs smoke-api 2>&1 | tail -50
          exit 1

      - name: Tear down the backend smoke stack
        if: always()
        run: |
          docker rm -f smoke-api smoke-db >/dev/null 2>&1 || true
          docker network rm smoke >/dev/null 2>&1 || true

      - name: Push backend RC
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/memship-backend
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
        run: |
          docker push $IMAGE:sha-$SHORT_SHA
          docker push $IMAGE:main

  build-frontend:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend RC
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/memship-frontend
          SHA: ${{ needs.resolve.outputs.sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
        run: |
          cd frontend
          docker build -f docker/Dockerfile \
            --label org.opencontainers.image.revision=$SHA \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t $IMAGE:sha-$SHORT_SHA \
            -t $IMAGE:main \
            .

      # `/en/login` renders without reaching the API, so this needs no backend
      # and stays a check on the image rather than on the pair. It is the
      # standalone server the deployment runs, so a bundle that is assembled
      # wrongly fails here instead of on someone's first page load.
      - name: Smoke-test the frontend image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/memship-frontend
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker run -d --name smoke-fe -p 127.0.0.1:3099:3000 \
            "$IMAGE:sha-$SHORT_SHA" >/dev/null

          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3099/en/login)" = "200" ]; then
              echo "frontend image served /en/login in ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "::error::the frontend image never served /en/login - not pushing"
          docker logs smoke-fe 2>&1 | tail -50
          exit 1

      - name: Tear down the frontend smoke container
        if: always()
        run: docker rm -f smoke-fe >/dev/null 2>&1 || true

      - name: Push frontend RC
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/memship-frontend
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
        run: |
          docker push $IMAGE:sha-$SHORT_SHA
          docker push $IMAGE:main

  # A release can only promote what exists, so an incomplete RC set is a failure,
  # not a footnote — release.yml refuses to rebuild and would stop dead.
  summary:
    needs: [resolve, build-backend, build-frontend]
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: RC summary
        env:
          OWNER: ${{ github.repository_owner }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          BACKEND: ${{ needs.build-backend.result }}
          FRONTEND: ${{ needs.build-frontend.result }}
        run: |
          {
            echo "### Release-candidate images (deploy to staging)"
            echo ""
            echo "Commit: \`$SHORT_SHA\`"
            echo ""
            echo "| Service | Result | Tag |"
            echo "|---|---|---|"
            echo "| backend | $BACKEND | \`ghcr.io/$OWNER/memship-backend:sha-$SHORT_SHA\` |"
            echo "| frontend | $FRONTEND | \`ghcr.io/$OWNER/memship-frontend:sha-$SHORT_SHA\` |"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          if [[ "$BACKEND" != "success" || "$FRONTEND" != "success" ]]; then
            {
              echo "**This commit has an incomplete RC set and cannot be released.**"
              echo ""
              echo "Re-run this workflow (Actions → Build Images → Run workflow) once the"
              echo "failure is fixed, then release."
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "Release with: \`./scripts/release.sh <version>\` on the validated commit." >> $GITHUB_STEP_SUMMARY

  ci-failed:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: CI failed
        run: |
          echo "### RC build skipped — CI failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Fix the tests before RC images can be built." >> $GITHUB_STEP_SUMMARY
          exit 1
