# Continuous Integration
# Runs backend tests and frontend checks on push to main and PRs.
# Each suite only runs when its own paths changed (see the `changes` job).
#
# The workflow itself runs on EVERY push and PR, with the path filtering done per
# job rather than at the trigger. Two reasons:
#
#   - build-images.yml keys off this workflow completing on main. Filtering at the
#     trigger meant a commit touching only docs never ran CI, so it never got RC
#     images either — and release.yml refuses to release a commit without them.
#     That would leave a docs-only commit at the tip of main unreleasable.
#   - A PR that changes neither backend nor frontend used to report no checks at
#     all, which is indistinguishable from checks that have not started yet.
#
# The cost is the `changes` job on runs that then skip everything else.
#
# `pull_request` matches EVERY base branch, not just main. Scoped to `main` it
# did not match a PR opened against another branch — the natural thing to do
# when one change depends on another — so a stacked PR ran nothing at all while
# GitHub still reported it MERGEABLE/CLEAN. `mergeable` describes conflicts, not
# checks, so the PR looked ready by every signal a reviewer glances at (#455).
# `edited` is in the types for the other half: retargeting a PR fires `edited`,
# which is not in the default set, so a PR opened against another base and then
# pointed at main kept reporting no checks.
#
# One consequence worth knowing: `paths-filter` diffs against the PR's own base,
# so a stacked PR filters on its own changes rather than on everything since
# main. That is the right reading for incremental review — the PR underneath
# already ran its own suites — but it means the filter answers a narrower
# question on a stacked PR than on one based on main.
#
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      caddy: ${{ steps.filter.outputs.caddy }}
      shell: ${{ steps.filter.outputs.shell }}
      docs: ${{ steps.filter.outputs.docs }}
      locales: ${{ steps.filter.outputs.locales }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            caddy:
              - 'Caddyfile'
              - 'docker-compose.quickstart.yml'
              - 'scripts/check-caddy-headers.sh'
            # scripts/ matched nothing here until now, so a PR touching only the
            # deployment scripts reported `Detect changes: pass` and every test
            # job skipped — which is how the upgrade guards merged with nothing
            # run against them (#215). The deployment files are in the filter
            # too: the shell tests copy docker-compose.yml and the Caddyfile
            # into their sandboxes and checksum them the way the release does.
            shell:
              - 'scripts/**'
              - 'tests/shell/**'
              - 'docker-compose.yml'
              - 'Caddyfile'
            docs:
              - 'docs/**'
              - 'scripts/check-docs-translations.sh'
            # The UI translations, a different thing from the `docs` filter
            # above, and checked by nothing at all until now (#509).
            locales:
              - 'frontend/locales/**'
              - 'scripts/check-locales.sh'

  caddy-headers:
    name: Caddy Header Parity
    needs: changes
    if: ${{ needs.changes.outputs.caddy == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compare the two Caddy header blocks
        run: ./scripts/check-caddy-headers.sh

  docs-translations:
    name: Translation Drift
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth is irrelevant here: the check hashes the working tree with
      # `git hash-object`, not a commit range, so a shallow checkout is enough.
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check each translation against the page it came from
        run: ./scripts/check-docs-translations.sh

  # Deliberately NOT called "Translation Drift". That name belongs to the job
  # above, which checks `docs/`. The two being confusable is half of why the UI
  # locales went unchecked for so long (#509).
  locales:
    name: UI Locale Parity
    needs: changes
    if: ${{ needs.changes.outputs.locales == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compare the three locale key sets
        run: ./scripts/check-locales.sh

  shell:
    name: Deployment Script Tests
    needs: changes
    if: ${{ needs.changes.outputs.shell == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Two different questions, both cheap. shellcheck asks whether the bash is
      # correct; the suite asks whether the guards hold.
      #
      # --severity=warning rather than the default: the scripts are clean at
      # warning and above, and the handful of `info`/`style` notes below that are
      # all deliberate — pull-backup.sh's `$REMOTE_PATH` is *meant* to expand on
      # the client side (SC2029), and a printf format that says `latest` in
      # backticks is prose, not an unexpanded expression (SC2016). Gating on
      # those would mean either three disable comments or changing correct code
      # to satisfy a linter. Anything at warning or above is a real finding.
      - name: Shellcheck
        run: |
          shellcheck --version
          shellcheck -x --severity=warning scripts/*.sh
          shellcheck -x --severity=warning tests/shell/*.sh

      # No bats, no containers, no network, no database — see tests/shell/lib.sh
      # for why the harness is a plain runner and what the stub docker answers.
      - name: Run the deployment script tests
        run: ./tests/shell/run.sh

  unit:
    name: Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///unused.db
          DATABASE_TEST_URL: sqlite:///unused.db
          SECRET_KEY: test-secret-key-for-ci-minimum-32-chars
        run: uv run pytest tests/unit/ -v --tb=short

  integration:
    name: Integration Tests
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: memship
          POSTGRES_PASSWORD: memship
          POSTGRES_DB: memship_test_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Celery broker. Several endpoints fire a fire-and-forget task.delay() in
      # the request path; without a reachable broker each call blocks ~19s on a
      # connection retry before the error is swallowed, inflating the suite from
      # ~1min to ~9min. CELERY_BROKER_URL defaults to redis://localhost:6379/0.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev

      # `create_all` builds every test database and `alembic upgrade head`
      # builds every install, and nothing compared them. They had drifted into
      # 36 differences: 28 server defaults the models declared Python-side as
      # `default=` and so never emitted as DDL, 7 constraints whose definitions
      # matched under different names, and an index no model declared. The
      # suite could therefore pass against a schema no deployment has.
      # `alembic check` diffs the models against a migrated database, so this
      # fails the build the day the two disagree again.
      - name: Schema guard (models match migrations)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://memship:memship@localhost:5434/schema_guard
          SECRET_KEY: test-secret-key-for-ci-minimum-32-chars
        run: |
          PGPASSWORD=memship psql -h localhost -p 5434 -U memship -d postgres \
            -c 'DROP DATABASE IF EXISTS schema_guard' \
            -c 'CREATE DATABASE schema_guard'
          uv run alembic upgrade head
          uv run alembic check

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://memship:memship@localhost:5434/memship_test_db
          DATABASE_TEST_URL: postgresql://memship:memship@localhost:5434/memship_test_db
          SECRET_KEY: test-secret-key-for-ci-minimum-32-chars
        run: uv run pytest tests/integration/ -v --tb=short -n 2

      - name: Test Summary
        if: always()
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "All tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Tests failed." >> $GITHUB_STEP_SUMMARY
          fi

  # The whole suite in ONE process, which is the thing the two jobs above
  # cannot do between them.
  #
  # `unit` and `integration` run as separate processes, so state that is global
  # to a process and set by one suite is invisible to the other. The local
  # runner (`./scripts/dev.sh test`) runs `pytest tests/` as a single process,
  # which is why two `TestRedisUnavailable` assertions fail there in most runs
  # and have never once failed in CI (#506). CI was structurally unable to see
  # the category, not merely lucky.
  #
  # The two tests #506 is about are DESELECTED, so this job is green today and
  # red only on a NEW leak.
  #
  # The alternative was to run them and mark the job `continue-on-error`. That
  # keeps the workflow green but the check itself still reports failure, so
  # every backend pull request would carry a red X that means "yes, we know".
  # A check that is red from its first commit teaches people to ignore the
  # check, which is the opposite of what this job is for.
  #
  # Deselecting makes it a real gate from day one: it asserts that nothing
  # OTHER than the known pair leaks across the unit/integration boundary, which
  # is the thing no other job can see at all. #506 keeps the two known failures,
  # reproduced there with a CI run. Remove the deselects when it is fixed.
  combined:
    name: Full Suite (single process)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: memship
          POSTGRES_PASSWORD: memship
          POSTGRES_DB: memship_test_db
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev

      # No `-n`: xdist would put the suites back into separate processes and
      # undo the entire reason this job exists.
      #
      # The two deselects are #506, reproduced and evidenced on that issue. They
      # fail here and pass in `Unit Tests`, which is the whole point, and they
      # come back the day #506 closes.
      - name: Run the whole suite in one process
        id: suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://memship:memship@localhost:5435/memship_test_db
          DATABASE_TEST_URL: postgresql://memship:memship@localhost:5435/memship_test_db
          SECRET_KEY: test-secret-key-for-ci-minimum-32-chars
        run: |
          uv run pytest tests/ --tb=short -q \
            --deselect tests/unit/test_rate_limit.py::TestRedisUnavailable::test_the_fallback_is_logged_as_an_error \
            --deselect tests/unit/test_rate_limit.py::TestRedisUnavailable::test_recovery_is_logged

      - name: Report what this job saw
        if: always()
        run: |
          echo "### Full suite, single process" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Two tests are deselected here and tracked in #506." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.suite.outcome }}" = "success" ]; then
            echo "Passed: nothing else leaks across the unit/integration boundary." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Failed, and this is worth reading.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "A failure here that Unit Tests and Integration Tests do not show is" >> $GITHUB_STEP_SUMMARY
            echo "process-global state leaking between the two suites — a new instance" >> $GITHUB_STEP_SUMMARY
            echo "of #506, not the known one, which is deselected above." >> $GITHUB_STEP_SUMMARY
          fi

  frontend:
    name: Frontend Checks
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.29.3 --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Proxy route coverage
        working-directory: frontend
        run: pnpm check:proxy-routes
