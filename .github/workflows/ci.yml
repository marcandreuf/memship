# Continuous Integration
# Runs backend tests and frontend checks on push to main and PRs.
# Each suite only runs when its own paths changed (see the `changes` job).
#
# The workflow itself runs on EVERY push and PR, with the path filtering done per
# job rather than at the trigger. Two reasons:
#
#   - build-images.yml keys off this workflow completing on main. Filtering at the
#     trigger meant a commit touching only docs never ran CI, so it never got RC
#     images either — and release.yml refuses to release a commit without them.
#     That would leave a docs-only commit at the tip of main unreleasable.
#   - A PR that changes neither backend nor frontend used to report no checks at
#     all, which is indistinguishable from checks that have not started yet.
#
# The cost is the `changes` job on runs that then skip everything else.
#
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  unit:
    name: Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///unused.db
          DATABASE_TEST_URL: sqlite:///unused.db
          SECRET_KEY: test-secret-key-for-ci-minimum-32-chars
        run: uv run pytest tests/unit/ -v --tb=short

  integration:
    name: Integration Tests
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: memship
          POSTGRES_PASSWORD: memship
          POSTGRES_DB: memship_test_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Celery broker. Several endpoints fire a fire-and-forget task.delay() in
      # the request path; without a reachable broker each call blocks ~19s on a
      # connection retry before the error is swallowed, inflating the suite from
      # ~1min to ~9min. CELERY_BROKER_URL defaults to redis://localhost:6379/0.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://memship:memship@localhost:5434/memship_test_db
          DATABASE_TEST_URL: postgresql://memship:memship@localhost:5434/memship_test_db
          SECRET_KEY: test-secret-key-for-ci-minimum-32-chars
        run: uv run pytest tests/integration/ -v --tb=short -n 2

      - name: Test Summary
        if: always()
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "All tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Tests failed." >> $GITHUB_STEP_SUMMARY
          fi

  frontend:
    name: Frontend Checks
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.29.3 --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc --noEmit
