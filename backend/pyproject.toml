[project]
name = "memship"
version = "0.0.1"
description = "Memship — self-hosted membership management system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.0",
    "psycopg2-binary>=2.9",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "email-validator>=2.0",
    "celery[redis]>=5.4",
    "jinja2>=3.1",
    "resend>=2.0",
    "weasyprint>=62.0",
    "cryptography>=42.0",
    "sepaxml>=2.6",
    "stripe>=10.0",
    # 1.2.2 or newer, not 1.2: in 1.2.0 `Request._parameters` is a class
    # attribute, so every Request in the process shares one dict. A Bizum
    # payment sets `Ds_Merchant_PayMethods` and every later request — card
    # included — kept sending it, so once any member chose Bizum the whole
    # worker sent card payments to the Bizum flow until it restarted.
    "python-redsys>=1.2.2",
    "segno>=1.6",
    "authlib>=1.3",
    # authlib.integrations.starlette_client imports httpx at import time, so it
    # is a runtime dependency of the SSO flow — not just a test-client dep.
    "httpx>=0.27",
    "itsdangerous>=2.2",
]

license = "AGPL-3.0-only"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "factory-boy>=3.3",
    # Parses the compose files in tests/unit/test_deployment_env.py. It arrives
    # anyway via uvicorn[standard], but that is a transitive edge that a future
    # uvicorn release is free to drop.
    "PyYAML>=6.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Only the `F` rules, and that is a decision rather than a starting point.
#
# The full default set reports 829 findings here, of which 639 are B008
# function-call-in-default-argument — FastAPI's `Depends()` idiom, so a false
# positive on every route in the codebase — and ~130 are style. Gating on a
# checker whose output is four-fifths noise teaches people to scroll past it.
#
# `F` is pyflakes: unused imports, unused variables, undefined names. Every one
# is a real defect or real dead code, which is what makes it gateable on the
# day it is added rather than after a cleanup project.
#
# Scope is `app/` only, matching how #356 measured it. `tests/` and `alembic/`
# are not covered yet and would each bring their own backlog.
[tool.ruff]
src = ["app"]

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
