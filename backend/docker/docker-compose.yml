# The dev stack ships weak-on-purpose settings: a fixed database password, Redis
# with no auth, and — after `dev.sh seed test` — super admin credentials that are
# published in this repository. Publishing those ports on 0.0.0.0 put all of it on
# the local network. They bind to loopback instead; set DEV_BIND=0.0.0.0 for the
# session when you deliberately need another device to reach the stack.
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: memship-api
    ports:
      - "${DEV_BIND:-127.0.0.1}:8003:8000"
    environment:
      - DATABASE_URL=postgresql://memship:memship@db:5432/memship_db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - APP_ENV=${APP_ENV:-development}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-es}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=1
      - APP_VERSION=${APP_VERSION:-dev}
    volumes:
      - ../app:/app/app
      - ../alembic:/app/alembic
      - ../start.py:/app/start.py
      - ../alembic.ini:/app/alembic.ini
      # Three services mount this volume. Docker copies the image's
      # /app/storage into a named volume the first time one is mounted empty,
      # and concurrent copies collide — "failed to mkdir .../registrations:
      # file exists" — failing the first `dev.sh start all` on a clean machine
      # (#72). The API goes first and the celery services wait on it, so only
      # one container ever populates the volume.
      - memship-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: memship-redis
    ports:
      - "${DEV_BIND:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: memship-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://memship:memship@db:5432/memship_db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - APP_VERSION=${APP_VERSION:-dev}
    volumes:
      - ../app:/app/app
      - memship-storage:/app/storage
    depends_on:
      # The API populates memship-storage — see the note in the api service.
      api:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: memship-celery-beat
    # --schedule is not optional: without it beat writes `celerybeat-schedule`
    # into the working directory, which is root-owned /app, and the container
    # runs as uid 1001. That is a permission error on every start, not just on a
    # clean volume. The production compose has always passed this path.
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    environment:
      - DATABASE_URL=postgresql://memship:memship@db:5432/memship_db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - APP_VERSION=${APP_VERSION:-dev}
    volumes:
      - ../app:/app/app
      - memship-storage:/app/storage
      # Survives a restart, so beat does not re-fire a job it already ran.
      - memship-celerybeat:/var/lib/celery
    depends_on:
      # The API populates memship-storage — see the note in the api service.
      api:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: memship-db
    ports:
      - "${DEV_BIND:-127.0.0.1}:5433:5432"
    environment:
      - POSTGRES_USER=memship
      - POSTGRES_PASSWORD=memship
      - POSTGRES_DB=memship_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "memship", "-d", "memship_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-test:
    image: postgres:15-alpine
    container_name: memship-db-test
    ports:
      - "${DEV_BIND:-127.0.0.1}:5434:5432"
    environment:
      - POSTGRES_USER=memship
      - POSTGRES_PASSWORD=memship
      - POSTGRES_DB=memship_test_db
    tmpfs:
      - /var/lib/postgresql/data
    profiles:
      - test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "memship", "-d", "memship_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: memship-adminer
    ports:
      - "${DEV_BIND:-127.0.0.1}:8181:8080"
    profiles:
      - tools
    restart: unless-stopped

volumes:
  pgdata:
  memship-storage:
  memship-celerybeat:
