# Memship — Full-stack deployment with Caddy reverse proxy
#
# Quick start:
#   docker compose up -d
#   docker compose exec -it api python -m app.cli.seed
#   Open http://localhost
#
# To use pre-built images from GHCR instead of building locally,
# set IMAGE_TAG in .env (e.g., IMAGE_TAG=0.1.3)
#
# PERSISTENT DATA lives on the host under MEMSHIP_DATA_ROOT (default ./data),
# as bind mounts rather than named volumes. Two reasons: you can find, back up
# and rsync your data with ordinary tools, and it cannot be destroyed by
# `docker compose down -v` or `docker system prune --volumes`.
#
# `scripts/install.sh` creates the directory tree. If you bring the stack up by
# hand, Docker creates any missing directory as root — which works, but see
# docs/self-hosting/ for the ownership notes.

# The API, the Celery worker and Celery beat run the same image with the same
# settings — only the command differs. Kept in one anchor so a new setting cannot
# be added to the API and silently forgotten on the worker.
x-backend-env: &backend-env
  DATABASE_URL: postgresql://memship:${DB_PASSWORD:-memship}@db:5432/memship_db
  # No default: the old "dev-secret-key-change-in-production" fallback is in the
  # repository, so any stack brought up without .env was signing sessions with a
  # published key. scripts/install.sh generates a real one; unset, the backend
  # persists a per-install key to storage/session.key instead.
  SECRET_KEY: ${SECRET_KEY:-}
  SESSION_KEY_FILE: ${SESSION_KEY_FILE:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-}
  # Encrypts the SSO and payment-provider secrets held in the database. Unset,
  # the app mints a per-install key under storage/ — which a restored database
  # dump on a rebuilt host cannot decrypt, because the key lived on the old one.
  # scripts/install.sh generates this precisely so that restore works.
  MEMSHIP_SECRET_KEY: ${MEMSHIP_SECRET_KEY:-}
  SECRETS_KEY_FILE: ${SECRETS_KEY_FILE:-}
  APP_ENV: ${APP_ENV:-production}
  DEFAULT_LOCALE: ${DEFAULT_LOCALE:-es}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
  # Report the deployed image tag as the app version (no VERSION file; images
  # are promoted, not rebuilt, so the version is supplied at deploy time).
  APP_VERSION: ${IMAGE_TAG:-latest}
  CELERY_BROKER_URL: redis://redis:6379/0
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@memship.local}
  SMTP_TLS: ${SMTP_TLS:-true}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
  # The origin an external service reaches this API on. It builds the SSO
  # callback URL, which must match the redirect URI registered with the
  # provider exactly, and the Redsys `Ds_Merchant_MerchantURL` — so if it is
  # wrong the gateway cannot notify us and paid receipts are never settled.
  # Same default as FRONTEND_URL: Caddy serves both on one host.
  BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost}
  # SSO fallbacks. Settings > Single sign-on overrides whatever is set here.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}

services:
  caddy:
    image: caddy:2-alpine
    container_name: memship-caddy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # The site address Caddy serves. A bare hostname makes Caddy provision a
      # Let's Encrypt certificate automatically; the default `:80` serves plain
      # HTTP, which is what you want on localhost. See docs/self-hosting/.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ACME account key and issued certificates. Losing this re-issues from
      # scratch, and Let's Encrypt allows only 5 duplicate certificates a week.
      - ${MEMSHIP_DATA_ROOT:-./data}/caddy/data:/data
      - ${MEMSHIP_DATA_ROOT:-./data}/caddy/config:/config
    depends_on:
      - frontend
      - api
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-ghcr.io/marcandreuf/memship-backend:${IMAGE_TAG:-latest}}
    build:
      context: backend
      dockerfile: docker/Dockerfile
    container_name: memship-api
    # Run as the host operator, not root, so files written to the bind-mounted
    # storage belong to you. scripts/install.sh writes HOST_UID/HOST_GID; the
    # 1001 fallback is the image's built-in user.
    user: "${HOST_UID:-1001}:${HOST_GID:-1001}"
    expose:
      - "8000"
    ports:
      # Loopback-only. Docker publishes ports by writing its own iptables rules
      # ahead of ufw's, so a bare "8003:8000" is reachable from the internet on
      # any box with a public IP even while the firewall reports it denied.
      # Nothing needs this from outside — Caddy reaches the API over the compose
      # network. Set API_BIND=0.0.0.0 if you deliberately want it published.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8003}:8000"
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: 1
    volumes:
      # Uploaded files (logos, member photos, activity covers, attachments) AND
      # the auto-generated encryption key at storage/secret.key. Without this
      # volume a container recreate destroys the uploads and rotates the key,
      # which makes every stored SSO/payment secret undecryptable — see
      # SECRETS_KEY_FILE in backend/app/core/config.py.
      - ${MEMSHIP_DATA_ROOT:-./data}/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    image: ${API_IMAGE:-ghcr.io/marcandreuf/memship-backend:${IMAGE_TAG:-latest}}
    build:
      context: backend
      dockerfile: docker/Dockerfile
    container_name: memship-celery-worker
    # Run as the host operator, not root, so files written to the bind-mounted
    # storage belong to you. scripts/install.sh writes HOST_UID/HOST_GID; the
    # 1001 fallback is the image's built-in user.
    user: "${HOST_UID:-1001}:${HOST_GID:-1001}"
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      <<: *backend-env
      # Only the API applies migrations; a second migrator races it on startup.
      RUN_MIGRATIONS: 0
    volumes:
      - ${MEMSHIP_DATA_ROOT:-./data}/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: ${API_IMAGE:-ghcr.io/marcandreuf/memship-backend:${IMAGE_TAG:-latest}}
    build:
      context: backend
      dockerfile: docker/Dockerfile
    container_name: memship-celery-beat
    # Run as the host operator, not root, so files written to the bind-mounted
    # storage belong to you. scripts/install.sh writes HOST_UID/HOST_GID; the
    # 1001 fallback is the image's built-in user.
    user: "${HOST_UID:-1001}:${HOST_GID:-1001}"
    # Scheduled billing run (02:00) and payment reminders (03:00) — see
    # beat_schedule in backend/app/core/celery_app.py. The schedule database is
    # kept on a volume so a restart does not re-fire a job it already ran.
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: 0
    volumes:
      - ${MEMSHIP_DATA_ROOT:-./data}/celerybeat:/var/lib/celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/marcandreuf/memship-frontend:${IMAGE_TAG:-latest}}
    build:
      context: frontend
      dockerfile: docker/Dockerfile
    container_name: memship-frontend
    expose:
      - "3000"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: memship-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: memship-db
    ports:
      # Loopback-only, for the same reason as the API above — and it matters more
      # here: this was publishing PostgreSQL to the internet, password-protected
      # but exposed. Backups use `docker compose exec`, not this port, so nothing
      # in normal operation needs it. Set DB_BIND=0.0.0.0 to publish deliberately.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5433}:5432"
    environment:
      - POSTGRES_USER=memship
      - POSTGRES_PASSWORD=${DB_PASSWORD:-memship}
      - POSTGRES_DB=memship_db
    volumes:
      # Postgres chowns this to its own uid (70 on alpine) via the image
      # entrypoint, so it stays 0700 and is not browsable by the host user.
      # That is correct — read your data with scripts/db-backup.sh, not `ls`.
      - ${MEMSHIP_DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
      - ${MEMSHIP_DATA_ROOT:-./data}/backups:/backups
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "memship", "-d", "memship_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# No named volumes: every persistent path is a bind mount under
# MEMSHIP_DATA_ROOT. See the header for why.
