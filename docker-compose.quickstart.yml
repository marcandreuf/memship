# Memship Quick Start — single-file deployment using pre-built images
#
# Usage:
#   curl -fsSL https://raw.githubusercontent.com/marcandreuf/memship/main/docker-compose.quickstart.yml -o docker-compose.yml
#   PORT=8081 docker compose up -d
#   docker compose exec demo-memship-api python -m app.cli.seed --test   # Quick demo with test accounts
#   docker compose exec demo-memship-api python -m app.cli.seed --demo   # Realistic year of demo data (idempotent)
#   docker compose exec demo-memship-api python -m app.cli.seed          # Custom setup (interactive)
#   Open http://localhost:8081
#

# The API, the Celery worker and Celery beat run the same image with the same
# settings — only the command differs. Kept in one anchor so a new setting cannot
# be added to the API and silently forgotten on the worker.
x-backend-env: &backend-env
  DATABASE_URL: postgresql://memship:memship@demo-memship-db:5432/memship_db
  SECRET_KEY: change-me-in-production-use-a-random-64-char-string
  APP_ENV: production
  APP_VERSION: ${IMAGE_TAG:-latest}
  DEFAULT_LOCALE: es
  CORS_ORIGINS: http://localhost
  FRONTEND_URL: http://localhost
  CELERY_BROKER_URL: redis://demo-memship-redis:6379/0

services:
  demo-memship-caddy:
    image: caddy:2-alpine
    container_name: demo-memship-caddy
    ports:
      - "${PORT:-80}:80"
    command:
      - sh
      - -c
      - |
        cat > /etc/caddy/Caddyfile <<'CADDYEOF'
        :80 {
          handle /api/v1/* {
            reverse_proxy demo-memship-api:8000
          }
          handle /uploads/* {
            reverse_proxy demo-memship-api:8000
          }
          handle {
            reverse_proxy demo-memship-frontend:3000
          }
        }
        CADDYEOF
        caddy run --config /etc/caddy/Caddyfile
    depends_on:
      - demo-memship-frontend
      - demo-memship-api
    restart: unless-stopped

  demo-memship-api:
    image: ghcr.io/marcandreuf/memship-backend:latest
    pull_policy: always
    container_name: demo-memship-api
    expose:
      - "8000"
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: 1
    volumes:
      - demo-memship-storage:/app/storage
    depends_on:
      demo-memship-db:
        condition: service_healthy
      demo-memship-redis:
        condition: service_healthy
    restart: unless-stopped

  # Sends the confirmation, cancellation, waitlist-promotion, receipt and
  # announcement emails. Without it every send is dropped silently — the
  # dispatch sites swallow the failure so the request still succeeds.
  demo-memship-celery-worker:
    image: ghcr.io/marcandreuf/memship-backend:latest
    pull_policy: always
    container_name: demo-memship-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      <<: *backend-env
      # Only the API applies migrations; a second migrator races it on startup.
      RUN_MIGRATIONS: 0
    volumes:
      - demo-memship-storage:/app/storage
    depends_on:
      demo-memship-db:
        condition: service_healthy
      demo-memship-redis:
        condition: service_healthy
    restart: unless-stopped

  # Scheduled billing run (02:00) and payment reminders (03:00) — see
  # beat_schedule in backend/app/core/celery_app.py.
  demo-memship-celery-beat:
    image: ghcr.io/marcandreuf/memship-backend:latest
    pull_policy: always
    container_name: demo-memship-celery-beat
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: 0
    volumes:
      - demo-memship-celerybeat:/var/lib/celery
    depends_on:
      demo-memship-db:
        condition: service_healthy
      demo-memship-redis:
        condition: service_healthy
    restart: unless-stopped

  demo-memship-frontend:
    image: ghcr.io/marcandreuf/memship-frontend:latest
    pull_policy: always
    container_name: demo-memship-frontend
    expose:
      - "3000"
    environment:
      - API_BASE_URL=http://demo-memship-api:8000
    depends_on:
      - demo-memship-api
    restart: unless-stopped

  demo-memship-redis:
    image: redis:7-alpine
    container_name: demo-memship-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  demo-memship-db:
    image: postgres:15-alpine
    container_name: demo-memship-db
    environment:
      - POSTGRES_USER=memship
      - POSTGRES_PASSWORD=memship
      - POSTGRES_DB=memship_db
    volumes:
      - demo-memship-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "memship", "-d", "memship_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  demo-memship-pgdata:
  demo-memship-storage:
  demo-memship-celerybeat:
